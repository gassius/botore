# Supabase local project configuration (pinned CLI: see package.json devDependencies)
project_id = "botore-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

# Local / CI only — never applied by hosted `db push`.
[db.seed]
enabled = true
sql_paths = ['./seed.sql']

[db.pooler]
enabled = false

[studio]
enabled = false
port = 54323

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3100"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[functions.health]
verify_jwt = false

[functions.combat-v1]
# Auth is enforced inside the handler (Bearer + auth.getUser). Gateway JWT
# verify stays off so local smoke can mint a seed-user token without Kong
# rejecting before the Edge Function runs (same pattern as /health).
verify_jwt = false
