packages:
  - 'apps/*'
  - 'packages/*'

# Expo / RN Android Gradle autolinking cannot follow pnpm's isolated layout for
# expo-modules-core (PackageList imports expo.core.ExpoModulesPackage). Hoist
# the linking packages so createBundle/assembleRelease can resolve them.
publicHoistPattern:
  - '*expo-modules-core*'
  - '*expo-modules-autolinking*'
  - '*babel-preset-expo*'

# pnpm 10+ blocks dependency build scripts by default.
# This is the explicit allowlist (pnpm >= 11 schema: allowBuilds.<name>: true).
allowBuilds:
  '@next/swc-linux-x64-gnu': set this to true or false
  # Needed by @sentry/react-native for EAS/native source-map + debug-symbol upload (R3).
  '@sentry/cli': true
  esbuild: true
  sharp: true
  unrs-resolver: true
