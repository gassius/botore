# C7 / C7c — native design-review + live-fight captures (NOT part of required PR quality gate).
# Produces Android emulator + iOS Simulator stills for human design review.
# No pixel-exact layout assertions.
#
# reactivecircus/android-emulator-runner runs each `script:` newline in its own
# `sh -c` — keep `script:` as a single line that invokes the committed bash job.
name: Native design captures

on:
  workflow_dispatch:
    inputs:
      routes:
        description: Comma-separated first-run routes (design stills path only)
        required: false
        default: 'Stable,Customise,ConfirmFight,Replay'
      clips:
        description: Also record short clips (true/false)
        required: false
        default: 'false'
      api_level:
        description: Android emulator API level
        required: false
        default: '34'
      cold_start:
        description: Record splash→title cold-start (expensive)
        required: false
        default: 'true'
  pull_request:
    paths:
      - 'apps/game/**'
      - 'scripts/native-capture/**'
      - '.github/workflows/native-design-captures.yml'
      - 'docs/architecture/native-design-captures.md'
      - 'apps/game/eas.json'

concurrency:
  group: native-captures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Sibling jobs poll/upload artifacts within the same run (Ubuntu tunnel ↔ macOS).
  actions: read

env:
  # Prefer workflow_dispatch inputs; PR events fall back to design-review defaults.
  CAPTURE_ROUTES: ${{ github.event.inputs.routes || 'Stable,Customise,ConfirmFight,Replay' }}
  CAPTURE_CLIPS: ${{ github.event.inputs.clips || 'false' }}
  CAPTURE_API_LEVEL: ${{ github.event.inputs.api_level || '34' }}
  # P2: expensive cold-start off on typical PRs; on for workflow_dispatch / explicit input.
  # C7c AC still needs splash→title evidence — live-fight jobs force CAPTURE_COLD_START=1.
  CAPTURE_COLD_START: ${{ github.event.inputs.cold_start || '0' }}
  EXPO_PUBLIC_DESIGN_CAPTURE: '1'
  EXPO_PUBLIC_DESIGN_CAPTURE_POSE_COMPARE: '1'
  EXPO_PUBLIC_DESIGN_CAPTURE_ROUTE: Stable
  CAPTURE_SETTLE_SEC: '3'
  CAPTURE_SECONDS: '5'
  CAPTURE_OUT_DIR: artifacts/native-captures
  # Never use RN community autolinking — PackageList would import nonexistent expo.core.*.
  EXPO_USE_COMMUNITY_AUTOLINKING: '0'
  CI: '1'
  # R3: capture CI has no Sentry org secrets — skip source-map / debug-symbol upload.
  SENTRY_DISABLE_AUTO_UPLOAD: 'true'

jobs:
  android-emulator-captures:
    name: Android emulator captures
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle-wrapper.properties', 'apps/game/package.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-avd-${{ env.CAPTURE_API_LEVEL }}-x86_64-pixel6

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build game workspace deps (dist/ for Metro)
        # Required before :app:createBundleReleaseJsAndAssets — packages export dist/.
        run: pnpm --filter @botore/game^... run build

      - name: Capture tooling check (scripts + eas.json)
        run: node scripts/native-capture/check-capture-env.mjs --platform android --tools-only

      - name: Install postgresql client (auth repair)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # sdkmanager intermittently downloads a truncated system image ("Error on
      # ZipFile unknown archive") and android-emulator-runner has no retry.
      # continue-on-error: preinstall must not block the runner if it still flakes;
      # success is verified by on-disk image markers (not `yes |` pipe status).
      - name: Preinstall Android system image (retry ZipFile flakes)
        id: android-system-image
        continue-on-error: true
        run: bash scripts/native-capture/preinstall-android-system-image.sh

      - name: Build + live first-run fight captures on emulator
        id: android-capture
        continue-on-error: true
        # Pin to v2.38.0 commit (do not float on @v2).
        # C3/C7c: garage → confirm → server replay → result + cold-start splash→title.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          # C7c AC: real cold-start on the live-fight path (workflow PR default stays 0).
          CAPTURE_COLD_START: '1'
          # Match baked EXPO_PUBLIC_COLD_START_SPLASH_HOLD_MS=60000 + title frames.
          CAPTURE_COLD_START_SEC: '75'
          CAPTURE_COLD_FRAME_COUNT: '28'
          CAPTURE_COLD_FRAME_INTERVAL_MS: '2500'
          CAPTURE_COLD_START_BUDGET_SEC: '180'
          EXPO_PUBLIC_COLD_START_SPLASH_HOLD_MS: '60000'
        with:
          api-level: ${{ env.CAPTURE_API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: ${{ steps.avd-cache.outputs.cache-hit != 'true' }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # ONE LINE ONLY — action splits newlines into separate sh -c invocations.
          script: bash scripts/native-capture/ci-live-fight-android-capture.sh

      - name: Retry Android emulator captures (SDK / boot flake)
        id: android-capture-retry
        if: steps.android-capture.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          CAPTURE_COLD_START: '1'
          CAPTURE_COLD_START_SEC: '75'
          CAPTURE_COLD_FRAME_COUNT: '28'
          CAPTURE_COLD_FRAME_INTERVAL_MS: '2500'
          CAPTURE_COLD_START_BUDGET_SEC: '180'
          EXPO_PUBLIC_COLD_START_SPLASH_HOLD_MS: '60000'
        with:
          api-level: ${{ env.CAPTURE_API_LEVEL }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/native-capture/ci-live-fight-android-capture.sh

      - name: Fail if Android captures still failed
        if: always() && steps.android-capture.outcome == 'failure' && steps.android-capture-retry.outcome != 'success'
        run: |
          echo "Android emulator captures failed on first attempt and retry" >&2
          exit 1

      - name: Upload capture artifacts
        if: always() && (steps.android-capture.outcome == 'success' || steps.android-capture-retry.outcome == 'success')
        uses: actions/upload-artifact@v4
        with:
          name: native-design-captures-android-${{ github.sha }}
          path: artifacts/native-captures/
          if-no-files-found: error
          retention-days: 14

  # C7c: Colima/qemu on macos-15 hosted runners starves the agent (lost communication).
  # Run Supabase on Ubuntu and expose Kong via Cloudflare quick tunnel for the Simulator.
  # No `needs:` between backend and ios — they start in parallel; iOS polls for the tunnel artifact.
  ios-live-fight-backend:
    name: iOS live-fight backend (tunnel)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client unzip

      - name: Start Supabase + Cloudflare tunnel
        env:
          # Upload artifact in the next step before keepalive.
          CAPTURE_BACKEND_KEEPALIVE: '0'
        run: bash scripts/native-capture/ci-ios-live-fight-backend.sh

      - name: Upload tunnel env for iOS Simulator job
        uses: actions/upload-artifact@v4
        with:
          name: ios-live-fight-tunnel-${{ github.sha }}
          path: artifacts/ios-live-fight-tunnel/
          if-no-files-found: error
          retention-days: 1

      - name: Keepalive until iOS captures finish
        env:
          CAPTURE_BACKEND_KEEPALIVE_MIN: '100'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/native-capture/ci-ios-live-fight-backend-keepalive.sh

  ios-simulator-captures:
    name: iOS Simulator captures
    # C7b/C7c: run on pull_request (path-gated) and workflow_dispatch.
    # macos-14 retired; public repo has free macOS minutes on macos-15.
    # Starts in parallel with ios-live-fight-backend (polls for tunnel artifact).
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Select Xcode + list phone simulators
        run: |
          set -euo pipefail
          echo "Available Xcode apps:"
          ls -1d /Applications/Xcode*.app 2>/dev/null || true
          SELECTED=""
          for candidate in \
            /Applications/Xcode_16.4.app \
            /Applications/Xcode_16.3.app \
            /Applications/Xcode_16.2.app \
            /Applications/Xcode_16.1.app \
            /Applications/Xcode_16.0.app \
            /Applications/Xcode.app; do
            if [[ -d "${candidate}/Contents/Developer" ]]; then
              SELECTED="${candidate}"
              break
            fi
          done
          if [[ -z "${SELECTED}" ]]; then
            echo "error: no Xcode.app found under /Applications" >&2
            exit 1
          fi
          echo "Selecting ${SELECTED}"
          sudo xcode-select -s "${SELECTED}/Contents/Developer"
          xcodebuild -version
          echo "Available phone-size simulators:"
          xcrun simctl list devices available | grep -E 'iPhone' | head -n 80

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Build game workspace deps (dist/ for Metro)
        run: pnpm --filter @botore/game^... run build

      - name: Capture tooling check (scripts + eas.json)
        run: node scripts/native-capture/check-capture-env.mjs --platform ios --tools-only

      - name: Wait for Ubuntu Supabase tunnel env
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CAPTURE_TUNNEL_WAIT_MIN: '45'
        run: bash scripts/native-capture/wait-ios-tunnel-env.sh artifacts/ios-live-fight-tunnel

      - name: Install ffmpeg (cold-start MP4 → frames)
        run: |
          set -euo pipefail
          brew install ffmpeg || true
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      # prebuild --clean wipes ios/; use --no-install so pods are not installed yet.
      # Restore CocoaPods/DerivedData AFTER prebuild, then pod install once (C7c PRR P2).
      - name: Expo prebuild (ios, no pod install)
        run: |
          set -euo pipefail
          cd apps/game
          CI=1 pnpm exec expo prebuild --platform ios --clean --no-install
          cd ../..
          node scripts/native-capture/patch-ios-ci-ats.mjs

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            apps/game/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('apps/game/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: apps/game/ios/DerivedData
          key: ${{ runner.os }}-dd-${{ hashFiles('apps/game/ios/Podfile.lock', 'apps/game/package.json', 'apps/game/app.json') }}-${{ hashFiles('apps/game/src/**/*.ts', 'apps/game/src/**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-dd-${{ hashFiles('apps/game/ios/Podfile.lock', 'apps/game/package.json', 'apps/game/app.json') }}-

      - name: pod install (once)
        run: |
          set -euo pipefail
          cd apps/game/ios
          pod install --deployment 2>/dev/null || pod install

      - name: Build + live first-run fight captures on iOS Simulator
        env:
          CAPTURE_OUT_DIR: artifacts/native-captures
          # Scheme auto-resolves (Botore after rename; never first CocoaPods entry).
          # Override with CAPTURE_IOS_SCHEME only when needed.
          CAPTURE_IOS_DEVICE: 'iPhone 16,iPhone 16 Plus,iPhone 15,iPhone 15 Pro,iPhone 14'
          CAPTURE_IOS_COLD_SEC: '16'
          CAPTURE_SETTLE_SEC: '5'
          CAPTURE_BOOT_SEC: '12'
          CAPTURE_IOS_SKIP_PREBUILD: '1'
          CAPTURE_COLD_START: '1'
          # Title burst after splash gate — must span remaining ≥60s splash hold.
          CAPTURE_COLD_START_SEC: '75'
          CAPTURE_COLD_FRAME_COUNT: '40'
          # Fresh-install simctl launch often >40s on GHA; hybrid launch+splash poll.
          CAPTURE_COLD_LAUNCH_TIMEOUT_SEC: '90'
          CAPTURE_COLD_SPLASH_WAIT_SEC: '120'
          CAPTURE_COLD_START_BUDGET_SEC: '300'
          CAPTURE_REMOTE_SUPABASE: '1'
          EXPO_PUBLIC_COLD_START_SPLASH_HOLD_MS: '60000'
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source artifacts/ios-live-fight-tunnel/tunnel.env
          set +a
          bash scripts/native-capture/ci-live-fight-ios-capture.sh

      - name: Upload capture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-design-captures-ios-${{ github.sha }}
          path: artifacts/native-captures/
          if-no-files-found: error
          retention-days: 14

      - name: Signal backend keepalive to stop
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios-live-fight-done
          date -u +%Y-%m-%dT%H:%M:%SZ > artifacts/ios-live-fight-done/done.txt
          echo "sha=${GITHUB_SHA}" >> artifacts/ios-live-fight-done/done.txt

      - name: Upload done marker for backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-live-fight-done-${{ github.sha }}
          path: artifacts/ios-live-fight-done/
          if-no-files-found: error
          retention-days: 1
