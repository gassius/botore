name: PR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier check
        run: pnpm exec prettier --check .

      - name: Lint, typecheck, unit/property/golden tests (turbo)
        run: pnpm exec turbo run lint typecheck test

      - name: Setup Deno (Edge Function runtime gate)
        uses: denoland/setup-deno@v2
        with:
          # Lockfile v5 requires Deno >= 2.3; keep in sync with local `deno --version`.
          deno-version: v2.9.8

      - name: Vendor Edge combat packages + Deno handler golden gate
        run: |
          pnpm exec turbo run build --filter=@botore/rng --filter=@botore/replay --filter=@botore/combat-engine
          node scripts/vendor-edge-combat.mjs
          node scripts/edge-combat-runtime-check.mjs
          node --test scripts/smoke-combat-assert.test.mjs
          node --test scripts/wait-edge-health.test.mjs scripts/pipefail-db-log.test.mjs

      - name: Architecture boundary check
        run: node scripts/check-boundaries.mjs

      - name: Secret scan
        run: bash scripts/scan-secrets.sh

      - name: License inventory
        run: bash scripts/license-inventory.sh

      - name: Dashboard production build
        run: pnpm --filter @botore/dashboard build

      - name: API production build
        run: pnpm --filter @botore/api build

  # B1 required check: real Vitest + Deno coverage thresholds (no invented metrics).
  backend-coverage:
    name: backend coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Workspace packages export dist/ only — build deps before Vitest coverage
      # so contracts/combat-engine can resolve @botore/replay (and peers).
      - name: Build packages for coverage (workspace deps → dist)
        run: |
          pnpm exec turbo run build \
            --filter=@botore/domain \
            --filter=@botore/rng \
            --filter=@botore/replay \
            --filter=@botore/contracts \
            --filter=@botore/combat-engine

      - name: Package coverage (domain + contracts + combat stack)
        run: |
          pnpm --filter @botore/domain exec vitest run --coverage
          pnpm --filter @botore/contracts exec vitest run --coverage
          pnpm --filter @botore/combat-engine exec vitest run --coverage
          pnpm --filter @botore/replay exec vitest run --coverage
          pnpm --filter @botore/rng exec vitest run --coverage

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8

      - name: Edge Function coverage (Deno --threshold on handlers)
        run: |
          node scripts/vendor-edge-combat.mjs
          node scripts/edge-coverage-gate.mjs

      - name: DB test marker inventory (source of truth)
        run: node scripts/db-test-coverage-gate.mjs

  database:
    name: supabase migrations + db tests + api integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm exec turbo run build

      - name: Start Supabase local stack
        run: pnpm exec supabase start --ignore-health-check || pnpm exec supabase start

      - name: Reset database (migrations + seed)
        run: |
          export DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          pnpm exec supabase db reset --local

      - name: Database tests (RLS, idempotency, append-only, bots-as-data)
        shell: bash
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          DB_TEST_LOG: /tmp/botore-db-tests.log
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          # pipefail via run-db-tests-logged.sh so psql failure is not masked by tee.
          # Do not use psql -q: RAISE NOTICE TEST-OK markers must reach the log.
          bash scripts/run-db-tests-logged.sh

      - name: DB test coverage gate (100% TEST-OK marker execution)
        run: node scripts/db-test-coverage-gate.mjs --log /tmp/botore-db-tests.log

      - name: Serve Edge Functions for live smoke
        shell: bash
        run: |
          set -euo pipefail
          eval "$(pnpm exec supabase status -o env | sed -E 's/^([A-Z0-9_]+)=/export \1=/')"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SERVICE_ROLE_KEY}"
          export SUPABASE_URL=http://127.0.0.1:54321
          {
            echo "SUPABASE_URL=${SUPABASE_URL}"
            echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}"
          } > /tmp/botore-functions.env
          # Attach to the running local stack; required so /functions/v1/* is live.
          pnpm exec supabase functions serve --env-file /tmp/botore-functions.env > /tmp/botore-functions-serve.log 2>&1 &
          echo $! > /tmp/botore-functions-serve.pid
          # Wait for HTTP 200 (not the first non-404); retries transient 5xx startup.
          if ! WAIT_EDGE_TIMEOUT_SEC=60 node scripts/wait-edge-health.mjs; then
            echo "functions serve log:"
            cat /tmp/botore-functions-serve.log || true
            exit 1
          fi

      - name: Backend smoke (health + catalogue + fight + outbox + Edge)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_URL: http://127.0.0.1:54321
          REQUIRE_EDGE_FUNCTIONS: '1'
        run: |
          # Export local API keys so combat smoke can Auth-login the seed fixture.
          eval "$(pnpm exec supabase status -o env | sed -E 's/^([A-Z0-9_]+)=/export \1=/')"
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$ANON_KEY}"
          export SUPABASE_SERVICE_ROLE_KEY="${SUPABASE_SERVICE_ROLE_KEY:-$SERVICE_ROLE_KEY}"
          node scripts/backend-smoke.mjs

      - name: API integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: pnpm --filter @botore/api test:integration
