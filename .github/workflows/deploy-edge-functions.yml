# Deploy Edge Functions with the Supabase CLI so the multi-file Deno layout
# (index.ts + relative modules + _shared) is preserved.
#
# Do NOT deploy via the Dashboard "bundle with esbuild" path for combat-v1 /
# platform-auth (or any Botore function) — that collapses the tree into a
# single bundle and drifts from local `functions serve` / Deno tests.
#
# Secrets (repo):
#   SUPABASE_ACCESS_TOKEN — personal access token with Edge Function deploy
#   SUPABASE_PROJECT_REF  — hosted project ref (Development: yrrytppmkykzhwelqmcs)
#
# ClickUp B4 (1amjtreye8f).

name: Deploy Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
      - 'scripts/check-edge-multifile-layout.mjs'
      - 'scripts/vendor-edge-combat.mjs'
      - 'packages/rng/**'
      - 'packages/replay/**'
      - 'packages/combat-engine/**'

permissions:
  contents: read

concurrency:
  # Fixed group so workflow_dispatch cannot race a main push deploy, and
  # non-main refs share the same lock (deploy job is main-only below).
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  assert-multifile:
    name: assert multi-file Edge layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Multi-file layout gate
        run: node scripts/check-edge-multifile-layout.mjs

  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    needs: assert-multifile
    # Main only — workflow_dispatch on other refs must not deploy.
    if: github.ref == 'refs/heads/main'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Require deploy secrets
        id: secrets
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_REF}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping deploy: set SUPABASE_ACCESS_TOKEN + SUPABASE_PROJECT_REF repo secrets (Development ref yrrytppmkykzhwelqmcs)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.skip == 'false'
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.skip == 'false'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.secrets.outputs.skip == 'false'
        run: pnpm install --frozen-lockfile

      - name: Vendor combat packages into Edge _shared
        if: steps.secrets.outputs.skip == 'false'
        run: |
          pnpm exec turbo run build --filter=@botore/rng --filter=@botore/replay --filter=@botore/combat-engine
          node scripts/vendor-edge-combat.mjs

      - name: Deploy all Edge Functions (CLI multi-file, not Dashboard esbuild)
        if: steps.secrets.outputs.skip == 'false'
        run: |
          set -euo pipefail
          # Workspace CLI — same entry used by local serve / CI smoke.
          pnpm exec supabase functions deploy \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes
          echo "Deployed Edge Functions to ${SUPABASE_PROJECT_REF} via CLI (multi-file layout)."
